# Build và kiểm thử trên máy thật. Chạy tay: chỉ Windows. Đẩy tag v*, hoặc chạy tay có chọn ban_nhap: cả Windows và Mac, bộ
# cài cất vào bản nháp v<phiên bản>. Chạy tay có ban_nhap mà cả hai xanh thì CI gắn (dời) tag v<phiên bản> vào commit vừa
# build; workflow phat-hanh chạy trên tag đó để đưa bản mới tới mọi máy.
name: build

on:
  workflow_dispatch:
    inputs:
      ban_nhap:
        description: Build cả Windows và Mac, cất bộ cài vào bản nháp v<phiên bản>, xanh thì gắn tag
        type: boolean
        default: false
  push:
    tags: ['v*']

# Bộ cài của lần đẩy tag được cất vào bản phát hành nháp của repo này (không tính dung lượng kho artifact, máy người dùng
# không thấy). Kho artifact của tài khoản chỉ khoảng 0,5 GB: đầy thì upload-artifact lỗi, nên bước đó không làm đỏ cả lượt.
permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      # Test giao diện lỗi vẫn đóng gói để có bộ cài thử trên máy thật; bước cuối vẫn báo đỏ để không bị bỏ sót.
      - id: e2e
        continue-on-error: true
        run: npx playwright test
      # Dùng bash vì PowerShell tách -c.win.x=true thành hai tham số, electron-builder hiểu nhầm là đường dẫn tệp cấu hình.
      - shell: bash
        run: npx electron-builder --win nsis zip --x64 -c.win.signAndEditExecutable=true --publish never
      # Cài bản cũ rồi để app tự tải, tự cài bản mới từ máy chủ cục bộ. Bước này chỉ chạy được trên Windows thật.
      - id: cap_nhat
        name: Thử cập nhật thật
        continue-on-error: true
        shell: bash
        run: node scripts/thu-cap-nhat.mjs
      # Máy đang chạy In Sticker 1.5.0 (bản cuối trước khi đổi tên thành Tools) phải tự cập nhật được lên bản này
      - id: doi_ten
        name: Thử cập nhật từ In Sticker 1.5.0 đã phát hành
        continue-on-error: true
        shell: bash
        env:
          BAN_CU: 1.5.0
        run: node scripts/thu-cap-nhat.mjs
      - name: Cất bộ cài vào bản phát hành nháp
        if: startsWith(github.ref, 'refs/tags/v') || inputs.ban_nhap
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cat-ban-nhap.mjs release/*.exe release/*.exe.blockmap release/*.zip release/latest.yml
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: in-sticker-windows
          retention-days: 3
          path: |
            release/*.exe
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure() || steps.e2e.outcome == 'failure'
        continue-on-error: true
        with:
          name: ket-qua-test-windows
          retention-days: 7
          path: tests/output/
      - name: Báo đỏ nếu test lỗi
        if: steps.e2e.outcome == 'failure' || steps.cap_nhat.outcome == 'failure' || steps.doi_ten.outcome == 'failure'
        run: exit 1

  mac:
    if: github.event_name == 'push' || inputs.ban_nhap
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright test
      # Từ 1.7.3 chỉ còn bản zip Tools, không còn bản zip tên cũ chứa In Sticker.app (máy Mac In Sticker 1.5.x cài tay bản Tools)
      - run: npx electron-builder --mac zip --arm64 --x64 --publish never
      - name: Cất bộ cài vào bản phát hành nháp
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/cat-ban-nhap.mjs release/*.zip release/*.zip.blockmap release/latest-mac.yml
      # Bộ cập nhật của Tools 1.6.0 tới 1.7.0 lấy tệp zip đầu tiên đúng chip: nay là bản zip Tools
      - id: tu_160
        name: Thử cập nhật từ Tools 1.6.0 đã phát hành
        continue-on-error: true
        env:
          BAN_CU: 1.6.0
        run: node scripts/thu-cap-nhat.mjs
      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: in-sticker-mac
          retention-days: 3
          path: |
            release/*.zip
            release/*.yml
            release/*.blockmap
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: failure() || steps.tu_160.outcome == 'failure'
        continue-on-error: true
        with:
          name: ket-qua-test-mac
          retention-days: 7
          path: tests/output/
      - name: Báo đỏ nếu thử cập nhật lỗi
        if: steps.tu_160.outcome == 'failure'
        run: exit 1

  # Chạy tay có ban_nhap, cả Windows và Mac xanh: gắn (dời) tag v<phiên bản> vào commit vừa build. Tag đẩy bằng GITHUB_TOKEN
  # không kích hoạt thêm lượt build nào.
  gan-tag:
    if: github.event_name == 'workflow_dispatch' && inputs.ban_nhap
    needs: [windows, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Gắn tag v<phiên bản>
        run: |
          v="v$(node -p "require('./package.json').version")"
          git tag -f "$v" "$GITHUB_SHA"
          git push -f origin "refs/tags/$v"
          echo "Đã gắn $v vào $GITHUB_SHA"
